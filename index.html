
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172554">
<title>AI Tech News</title>
<style>
body {
  margin: 0;
  background: #f3f5f9;
  color: #172033;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
header {
  background: #172554;
  color: white;
  padding: 24px 18px;
}
header h1 { margin: 0 0 8px; font-size: 25px; }
header p { margin: 0; font-size: 14px; }
main { padding: 16px; max-width: 700px; margin: auto; }
button {
  background: #1d4ed8;
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 15px;
}
#status { font-size: 14px; color: #526078; }
article {
  background: white;
  border-radius: 12px;
  padding: 16px;
  margin: 12px 0;
  box-shadow: 0 2px 8px #0000000a;
}
article h2 { font-size: 17px; margin: 0 0 10px; }
article a { color: #173ea5; text-decoration: none; }
.meta { color: #68758a; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>AI Tech News</h1>
  <p>AI・テクノロジーの最新ニュース</p>
</header>
<main>
  <button id="refresh">ニュースを更新</button>
  <p id="status">ニュースを読み込んでいます…</p>
  <section id="news"></section>
</main>
<script>
const query =
  'https://news.google.com/rss/search?q=' +
  encodeURIComponent('AI OR 人工知能 OR テクノロジー') +
  '&hl=ja&gl=JP&ceid=JP:ja';

async function loadNews() {
  const status = document.getElementById('status');
  const news = document.getElementById('news');
  const button = document.getElementById('refresh');

  button.disabled = true;
  status.textContent = 'ニュースを取得しています…';
  news.replaceChildren();

  try {
    const api =
      'https://api.rss2json.com/v1/api.json?rss_url=' +
      encodeURIComponent(query);

    const response = await fetch(
  'https://proxy.cors.dev/' + api
  );
    if (!response.ok) throw new Error('通信エラー');

    const data = await response.json();
    if (data.status !== 'ok') throw new Error('取得エラー');

    data.items.slice(0, 30).forEach(item => {
      const card = document.createElement('article');
      const heading = document.createElement('h2');
      const link = document.createElement('a');
      const meta = document.createElement('p');

      link.textContent = item.title;
      link.href = item.link;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';

      heading.appendChild(link);
      meta.className = 'meta';
      meta.textContent =
        (item.pubDate || '') +
        (item.author ? ' ・ ' + item.author : '');

      card.append(heading, meta);
      news.appendChild(card);
    });

    status.textContent =
      data.items.length + '件のニュースを取得しました。';
  } catch (error) {
    status.textContent =
    'エラー：' + error.message;
  } finally {
    button.disabled = false;
  }
}

document.getElementById('refresh').addEventListener(
  'click', loadNews
);
loadNews();
</script>
</body>
</html>
