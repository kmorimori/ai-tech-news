
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>AI・テックニュース</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#182238;--muted:#69758a;--blue:#3459e8;--line:#e0e6f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
header{background:#111827;color:#fff;padding:25px 18px 24px;padding-top:calc(25px + env(safe-area-inset-top));border-radius:0 0 24px 24px}
.wrap,main{max-width:760px;margin:auto}
.eyebrow{font-size:11px;color:#b9c8ff;font-weight:800;letter-spacing:.14em}
h1{font-size:27px;line-height:1.3;margin:7px 0}
header p{font-size:13px;color:#cbd5e1;margin:6px 0 0}
main{padding:16px 13px 40px}
.toolbar{display:flex;gap:8px}
#search{min-width:0;flex:1;width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px;font-size:15px}
button{font:inherit;cursor:pointer}
#refresh{border:0;border-radius:13px;background:var(--blue);color:white;padding:0 14px;font-size:13px;font-weight:700}
#refresh:disabled{opacity:.6}
.filters{display:flex;gap:7px;overflow-x:auto;padding:13px 0 9px}
.chip{white-space:nowrap;background:#fff;border:1px solid var(--line);color:#59667c;border-radius:999px;padding:8px 12px;font-size:13px}
.chip.active{background:#e8edff;border-color:#c5d1ff;color:#2448d1;font-weight:700}
.status{font-size:12px;color:var(--muted);padding:7px 2px 12px}
.story{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:0 0 11px;box-shadow:0 3px 12px #1b2b4b08}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:7px}
.source{color:var(--blue);font-weight:800}
.tag{background:#eef2ff;color:#4358a8;padding:2px 7px;border-radius:6px}
.story h2{font-size:16px;line-height:1.55;margin:0 0 8px}
.story h2 a{color:var(--ink);text-decoration:none}
.summary{font-size:13px;color:#58657a;margin:0 0 12px;overflow-wrap:anywhere}
.read{display:inline-block;font-size:13px;font-weight:750;color:var(--blue);text-decoration:none;padding:3px 0}
.translate-btn{display:inline-block;margin:2px 8px 8px 0;padding:7px 10px;border:1px solid #cbd5ff;border-radius:9px;background:#f0f3ff;color:#2948c8;font-size:12px;font-weight:700}
.original{font-size:12px;color:var(--muted);margin:7px 0 10px;white-space:pre-wrap}
.empty{background:#fff;border:1px dashed #cbd4e3;border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:14px}
.foot{font-size:11px;color:#788398;margin:20px 3px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="eyebrow">YOUR PERSONAL NEWS READER</div>
    <h1>AI・テックニュース</h1>
    <p>日本語中心に、AIとテクノロジーの動きをチェック</p>
  </div>
</header>
<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="記事・キーワードを検索">
    <button id="refresh">再読み込み</button>
  </div>
  <div class="filters" id="filters">
    <button class="chip active" data-filter="all">すべて</button>
    <button class="chip" data-filter="AI">AI・生成AI</button>
    <button class="chip" data-filter="Tech">テクノロジー</button>
    <button class="chip" data-filter="Dev">開発・IT</button>
  </div>
  <div id="status" class="status">ニュースを取得しています…</div>
  <section id="news"></section>
  <p class="foot">日本語のニュース配信元を優先しています。英語の記事は「日本語に翻訳」から見出しと概要を翻訳できます。翻訳は無料の非公式エンドポイントを利用するため、利用制限や仕様変更で動作しない場合があります。記事をタップすると配信元サイトが開きます。</p>
</main>
<script>
(function(){
  const googleFeed = words =>
    'https://news.google.com/rss/search?q=' +
    encodeURIComponent(words) + '&hl=ja&gl=JP&ceid=JP:ja';

  const feeds = [
    {name:'Googleニュース AI',url:googleFeed('AI OR 人工知能 OR 生成AI'),category:'AI'},
    {name:'Googleニュース ChatGPT',url:googleFeed('ChatGPT OR OpenAI OR Gemini OR Claude'),category:'AI'},
    {name:'Googleニュース テック',url:googleFeed('テクノロジー OR 半導体 OR ロボット'),category:'Tech'},
    {name:'Googleニュース IT',url:googleFeed('IT OR サイバーセキュリティ OR クラウド'),category:'Tech'},
    {name:'ITmedia AI+',url:'https://rss.itmedia.co.jp/rss/2.0/aiplus.xml',category:'AI'},
    {name:'ITmedia NEWS',url:'https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml',category:'Tech'},
    {name:'Zenn AI',url:'https://zenn.dev/topics/ai/feed',category:'Dev'},
    {name:'Zenn LLM',url:'https://zenn.dev/topics/llm/feed',category:'Dev'},
    {name:'Qiita LLM',url:'https://qiita.com/tags/llm/feed',category:'Dev'},
    {name:'Qiita ChatGPT',url:'https://qiita.com/tags/chatgpt/feed',category:'Dev'}
  ];

  const $ = id => document.getElementById(id);
  let allItems = [];
  let activeFilter = 'all';
  let loading = false;

  function textOnly(value){
    const doc = new DOMParser().parseFromString(value || '', 'text/html');
    return (doc.body.textContent || '').replace(/\s+/g,' ').trim();
  }

  function validUrl(value){
    try{
      const u = new URL(value);
      return ['https:','http:'].includes(u.protocol) ? u.href : '';
    }catch(e){return '';}
  }

  function parseFeed(xml,feed){
    const doc = new DOMParser().parseFromString(xml,'application/xml');
    if(doc.querySelector('parsererror')) throw new Error('RSSの形式エラー');

    return Array.from(doc.querySelectorAll('item,entry')).map(node=>{
      const title = textOnly(node.querySelector('title')?.textContent);
      const linkNode = node.querySelector('link');
      const link = validUrl(linkNode?.getAttribute('href') || linkNode?.textContent || '');
      const rawDate = node.querySelector('pubDate,published,updated')?.textContent || '';
      const description = node.querySelector('description,summary,content')?.textContent || '';
      const sourceNode = node.querySelector('source');

      return {
        title,link,
        summary:textOnly(description),
        source:sourceNode ? textOnly(sourceNode.textContent) : feed.name,
        category:feed.category,
        date:rawDate ? new Date(rawDate) : null,
        translatedTitle:'',
        translatedSummary:''
      };
    }).filter(x=>x.title && x.link);
  }

  async function fetchFeed(feed){
    const response = await fetch('https://proxy.cors.dev/' + feed.url);
    if(!response.ok) throw new Error('HTTP '+response.status);
    return parseFeed(await response.text(),feed);
  }

  async function translateToJapanese(text){
    const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ja&dt=t&q='+encodeURIComponent(text);
    const response=await fetch(url);
    if(!response.ok) throw new Error('翻訳サービスの応答エラー');
    const data=await response.json();
    if(!Array.isArray(data) || !Array.isArray(data[0])) throw new Error('翻訳結果を読み取れません');
    return data[0].map(part=>part && part[0] ? part[0] : '').join('');
  }

  function formatDate(date){
    if(!date || Number.isNaN(date.getTime())) return '';
    return new Intl.DateTimeFormat('ja-JP',{
      month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'
    }).format(date);
  }

  function render(){
    const term = $('search').value.trim().toLocaleLowerCase();
    const items = allItems.filter(x =>
      (activeFilter === 'all' || x.category === activeFilter) &&
      (!term || (x.title+' '+x.summary+' '+x.source+' '+x.translatedTitle+' '+x.translatedSummary).toLocaleLowerCase().includes(term))
    );

    $('news').replaceChildren();

    if(!items.length){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = allItems.length
        ? '該当する記事がありません。検索語やカテゴリを変えてみてください。'
        : '記事を取得できませんでした。「再読み込み」を押してもう一度お試しください。';
      $('news').appendChild(empty);
      return;
    }

    items.forEach(item=>{
      const card = document.createElement('article');
      card.className = 'story';

      const meta = document.createElement('div');
      meta.className = 'meta';

      const source = document.createElement('span');
      source.className = 'source';
      source.textContent = item.source;
      meta.appendChild(source);

      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = ({AI:'AI・生成AI',Tech:'テクノロジー',Dev:'開発・IT'})[item.category];
      meta.appendChild(tag);

      const date = document.createElement('span');
      date.textContent = formatDate(item.date);
      if(date.textContent) meta.appendChild(date);

      const heading = document.createElement('h2');
      const a = document.createElement('a');
      a.href = item.link;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = item.translatedTitle || item.title;
      heading.appendChild(a);
      card.append(meta,heading);

      const summary = document.createElement('p');
      summary.className = 'summary';
      summary.textContent = item.translatedSummary || item.summary || '概要は配信元の記事でご確認ください。';
      card.appendChild(summary);

      const isJapanese = /[ぁ-んァ-ヶ一-龠]/.test(item.title + ' ' + item.summary);
      if(!isJapanese){
        const translateBtn = document.createElement('button');
        translateBtn.className = 'translate-btn';
        translateBtn.textContent = item.translatedTitle ? '原文に戻す' : '日本語に翻訳';

        translateBtn.addEventListener('click',async()=>{
          if(item.translatedTitle){
            item.translatedTitle='';
            item.translatedSummary='';
            a.textContent=item.title;
            summary.textContent=item.summary || '概要は配信元の記事でご確認ください。';
            translateBtn.textContent='日本語に翻訳';
            return;
          }
          translateBtn.disabled=true;
          translateBtn.textContent='翻訳中…';
          try{
            item.translatedTitle=await translateToJapanese(item.title);
            item.translatedSummary=item.summary
              ? await translateToJapanese(item.summary.slice(0,1200))
              : '';
            a.textContent=item.translatedTitle;
            summary.textContent=item.translatedSummary || '概要は配信元の記事でご確認ください。';
            translateBtn.textContent='原文に戻す';
          }catch(err){
            translateBtn.textContent='翻訳に失敗・再試行';
            summary.textContent='翻訳サービスに接続できませんでした。通信環境を確認して再度お試しください。';
          }finally{
            translateBtn.disabled=false;
          }
        });
        card.appendChild(translateBtn);
      }

      const read = document.createElement('a');
      read.className='read';
      read.href=item.link;
      read.target='_blank';
      read.rel='noopener noreferrer';
      read.textContent='記事を読む ↗';
      card.appendChild(read);
      $('news').appendChild(card);
    });
  }

  async function loadNews(){
    if(loading) return;
    loading=true;
    $('refresh').disabled=true;
    $('refresh').textContent='取得中…';
    $('status').textContent='日本語中心のニュースを取得しています…';

    try{
      const results=await Promise.allSettled(feeds.map(fetchFeed));
      const succeeded=results.filter(x=>x.status==='fulfilled').flatMap(x=>x.value);
      const unique=new Map();
      succeeded.forEach(item=>{if(!unique.has(item.link)) unique.set(item.link,item);});
      allItems=Array.from(unique.values()).sort((a,b)=>{
        const da=a.date&&!Number.isNaN(a.date.getTime())?a.date.getTime():0;
        const db=b.date&&!Number.isNaN(b.date.getTime())?b.date.getTime():0;
        return db-da;
      });

      const failures=results.filter(x=>x.status==='rejected').length;
      $('status').textContent=allItems.length
        ? '記事 '+allItems.length+'件'+(failures?' · '+failures+'配信元に接続できませんでした':'')+
          ' · 更新 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})
        : 'ニュースを取得できませんでした。通信環境を確認して再読み込みしてください。';
      render();
    }catch(error){
      $('status').textContent='エラー：'+error.message;
    }finally{
      loading=false;
      $('refresh').disabled=false;
      $('refresh').textContent='再読み込み';
    }
  }

  $('filters').addEventListener('click',event=>{
    const button=event.target.closest('button[data-filter]');
    if(!button)return;
    activeFilter=button.dataset.filter;
    document.querySelectorAll('.chip').forEach(chip=>{
      chip.classList.toggle('active',chip===button);
    });
    render();
  });

  $('search').addEventListener('input',render);
  $('refresh').addEventListener('click',loadNews);
  loadNews();
})();
</script>
</body>
</html>
